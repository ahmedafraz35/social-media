<div class="auth-container">
  <div class="auth-background">
    <div class="auth-card shadow-lg">
      <div class="auth-header text-center mb-4">
        <h1 class="auth-logo">SocialBook</h1>
        <p class="auth-subtitle">Connect with friends and the world around you</p>
      </div>
      
      <div class="auth-form">
        <h3 class="auth-title text-center mb-4">Sign In</h3>
        
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
          <div class="mb-3">
            <label for="email" class="form-label auth-label">Email Address</label>
            <input 
              type="email" 
              class="form-control auth-input" 
              id="email"
              name="email"
              [(ngModel)]="loginData.email"
              placeholder="Enter your email"
              required
              #email="ngModel">
            <div *ngIf="email.invalid && email.touched" class="auth-error">
              Please enter a valid email address
            </div>
          </div>
          
          <div class="mb-3">
            <label for="password" class="form-label auth-label">Password</label>
            <input 
              type="password" 
              class="form-control auth-input" 
              id="password"
              name="password"
              [(ngModel)]="loginData.password"
              placeholder="Enter your password"
              required
              #password="ngModel">
            <div *ngIf="password.invalid && password.touched" class="auth-error">
              Password is required
            </div>
          </div>
          
          <div *ngIf="errorMessage" class="alert alert-danger auth-alert" role="alert">
            {{ errorMessage }}
          </div>
          
          <button 
            type="submit" 
            class="btn auth-btn w-100 mb-3"
            [disabled]="isLoading || loginForm.invalid">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
            {{ isLoading ? 'Signing In...' : 'Sign In' }}
          </button>
        </form>
        
        <div class="auth-divider">
          <span>or</span>
        </div>
        
        <div class="text-center">
          <p class="auth-switch">
            Don't have an account? 
            <a routerLink="/signup" class="auth-link">Sign Up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

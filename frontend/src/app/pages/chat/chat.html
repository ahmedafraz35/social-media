<!-- Chat Layout -->
<div class="container-fluid">
	<div class="row" style="height: 80vh;">
		<!-- Friends Sidebar -->
		<div class="col-lg-3 col-md-4 d-none d-md-block">
			<div class="sidebar-left h-100 p-3" style="background: #f3f3f3; border-radius: 16px;">
				<h5 class="side-heading mb-4">Friends</h5>
				<ul class="nav flex-column left-links-list">
					<li class="nav-item mb-2" *ngFor="let friend of friends">
						<a class="nav-link left-side-links d-flex justify-content-between align-items-center px-3 py-2 rounded shadow-sm" href="#" (click)="selectFriend(friend)">
							<span class="fw-semibold">{{ friend.name }}</span>
							<span class="badge bg-success ms-2" *ngIf="friend.online">Online</span>
						</a>
					</li>
				</ul>
			</div>
		</div>
		<!-- Chat Area -->
		<div class="col-lg-9 col-md-8 px-0 d-flex flex-column" style="height: 100%; position: relative;">
			<div class="chat-area flex-grow-1 d-flex flex-column justify-content-end" style="background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(100,175,255,0.10); padding: 32px 24px 16px 24px; overflow-y: auto;">
				<div *ngFor="let msg of messages" class="mb-3">
					<div [ngClass]="{'text-end': msg.fromMe, 'text-start': !msg.fromMe}">
						<span class="d-inline-block px-4 py-2 rounded-pill" [ngStyle]="msg.fromMe ? {'background':'#44baff','color':'#fff'} : {'background':'#f7fbff','color':'#222'}">
							{{ msg.text }}
						</span>
					</div>
				</div>
			</div>
			<!-- Message Input fixed at bottom -->
			<div class="chat-input-bar p-3" style="background: #f3f3f3; border-radius: 0 0 16px 16px; position: absolute; left: 0; right: 0; bottom: 0;">
				<form (ngSubmit)="sendMessage()" class="d-flex align-items-center gap-2">
					<input [(ngModel)]="messageText" name="messageText" class="form-control border-0 px-4 py-2 rounded-pill" type="text" placeholder="Type a message..." style="background: #fff; color: #222;">
					<button class="btn btn-post-action px-4" type="submit"><i class="bi bi-send me-2"></i>Send</button>
				</form>
			</div>
		</div>
	</div>
</div>

<div class="container py-5">
	<div class="row justify-content-center">
		<div class="col-lg-8">
			<div class="card shadow-lg border-0 rounded-4" style="background: #fff;">
				<!-- Profile Dashboard Navbar -->
				<nav class="navbar navbar-expand-lg navbar-dark mb-4" style="background-color: #44baff; border-radius: 12px;">
					<div class="container-fluid">
						<a class="navbar-brand fw-bold" href="#">Profile</a>
						<div class="d-flex w-100 align-items-center justify-content-between">
							<ul class="navbar-nav">
								<li class="nav-item">
									<a class="nav-link d-flex align-items-center" [routerLink]="['/home']"><i class="bi bi-house me-1"></i>Home</a>
								</li>
								<li class="nav-item">
									<a class="nav-link d-flex align-items-center" [routerLink]="['/chat']"><i class="bi bi-chat-dots me-1"></i>Chat</a>
								</li>
								<li class="nav-item">
									<a class="nav-link d-flex align-items-center" href="#"><i class="bi bi-gear me-1"></i>Settings</a>
								</li>
							</ul>
							<form class="d-flex mx-auto searchbar-professional" style="width: 300px; max-width: 100%;">
								<div class="input-group shadow rounded-pill overflow-hidden">
									<input class="form-control border-0 px-4 py-2" type="search" placeholder="Search profile..." aria-label="Search" style="background: #ffffff; color: #222;">
									<button class="btn btn-outline-light px-4" type="submit" style="background: #333; border: none;">
										<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
											<path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99c.41.41 1.09.41 1.5 0s.41-1.09 0-1.5l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#fff"/>
										</svg>
									</button>
								</div>
							</form>
							<div class="d-flex align-items-center ms-3">
								<div class="dropdown" style="position: relative;">
									<button class="btn p-0 border-0 bg-transparent d-flex align-items-center">
										<img [src]="profileImage" alt="Profile" width="36" height="36" class="rounded-circle border border-2 border-white shadow-sm">
									</button>
								</div>
							</div>
						</div>
					</div>
				</nav>
				<div class="card-body p-5">
					<div class="d-flex align-items-center mb-4">
						<img [src]="profileImage" alt="Profile" class="rounded-circle border border-2 border-info shadow-sm me-4" width="80" height="80">
						<div>
							<h3 class="fw-bold mb-1" style="color: #44baff;">{{ username }}</h3>
							<span class="text-muted fs-5">test@user.com</span>
						</div>
					</div>
					<hr>
					<div class="row mb-4">
						<div class="col-md-6 mb-3 mb-md-0">
							<div class="bg-light rounded-3 p-4 h-100">
								<h5 class="side-heading mb-3">Account Details</h5>
								<ul class="list-group list-group-flush">
									<li class="list-group-item"><strong>Username:</strong> {{ username }}</li>
									<li class="list-group-item"><strong>Email:</strong> test@user.com</li>
								</ul>
							</div>
						</div>
						<div class="col-md-6">
							<div class="bg-light rounded-3 p-4 h-100">
								<h5 class="side-heading mb-3">Profile Actions</h5>
								<ul class="list-group list-group-flush">
									<li class="list-group-item"><a class="btn btn-post-action w-100 mb-2" routerLink="/settings">Settings</a></li>
									<li class="list-group-item"><a class="btn btn-post-action w-100 mb-2" routerLink="/change-password">Change Password</a></li>
									<li class="list-group-item"><a class="btn btn-post-action w-100 mb-2" routerLink="/logout" (click)="logout()">Logout</a></li>
								</ul>
							</div>
						</div>
					</div>
					<div class="row mb-4">
						<div class="col-12">
							<div class="bg-light rounded-3 p-4">
								<h5 class="side-heading mb-3">Manage Posts</h5>
								<!-- Add Post -->
								<form (ngSubmit)="addPost()" class="mb-3">
									<div class="mb-2">
										<textarea [(ngModel)]="newPostText" name="newPostText" class="form-control" placeholder="What's on your mind?"></textarea>
									</div>
									<div class="mb-2">
										<input type="file" (change)="onPostImageChange($event)" accept="image/*" class="form-control">
									</div>
									<button class="btn btn-primary" type="submit">Add Post</button>
								</form>
								<!-- List Posts -->
								<div *ngFor="let post of userPosts; let i = index" class="mb-3">
									<div class="card">
										<div class="card-body">
											<div class="d-flex align-items-center mb-2">
												<img [src]="profileImage" width="40" height="40" class="rounded-circle me-2">
												<span class="fw-bold">{{ username }}</span>
											</div>
											<p>{{ post.caption }}</p>
											<img *ngIf="post.imageUrl" [src]="post.imageUrl" class="img-fluid rounded mb-2" style="max-height:200px;object-fit:cover;">
											<div class="d-flex gap-2">
												<button class="btn btn-sm btn-warning" (click)="editPost(i)">Edit</button>
												<button class="btn btn-sm btn-danger" (click)="deletePost(i)">Delete</button>
											</div>
											<!-- Edit Post Modal -->
											<div *ngIf="editIndex === i" class="mt-2">
												<textarea [(ngModel)]="editPostText" name="editPostText" class="form-control mb-2"></textarea>
												<input type="file" (change)="onPostImageChange($event)" accept="image/*" class="form-control mb-2">
												<button class="btn btn-success btn-sm" (click)="saveEditPost(i)">Save</button>
												<button class="btn btn-secondary btn-sm" (click)="cancelEditPost()">Cancel</button>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="row mb-4">
						<div class="col-12">
							<div class="bg-light rounded-3 p-4">
								<h5 class="side-heading mb-3">Profile Picture</h5>
								<form (ngSubmit)="uploadProfileImage()">
									<div class="mb-2">
										<input type="file" (change)="onProfileImageChange($event)" accept="image/*" class="form-control">
									</div>
									<button class="btn btn-info" type="submit">Upload Profile Picture</button>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
